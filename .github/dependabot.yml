version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      astro-and-styling:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      react-and-ui:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      sentry:
        patterns:
          - "@sentry/*"
        update-types:
          - "minor"
          - "patch"
      lint-and-types:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/calculation-engine"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
