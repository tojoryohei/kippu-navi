name: Deploy staging manually

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '手動デプロイする同一リポジトリのブランチ名（最新SHAを使用）'
        required: true
        type: string

permissions:
  contents: read

# 手動stagingデプロイは両サービスを同じ排他区間で公開する。
concurrency:
  group: shared-staging-deployment
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: target
        with:
          script: |
            const { resolveTarget } = await import('${{ github.workspace }}/scripts/staging/checks.mjs');
            const target = await resolveTarget(github, context);
            core.setOutput('sha', target.sha);
            core.setOutput('branch', target.branch);

  frontend:
    needs: resolve
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      staging: true
      target_sha: ${{ needs.resolve.outputs.sha }}
    secrets:
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  api:
    needs: [resolve, frontend]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      staging: true
      target_sha: ${{ needs.resolve.outputs.sha }}
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      SA_EMAIL: ${{ secrets.SA_EMAIL }}
