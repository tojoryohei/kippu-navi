name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: デプロイする同一リポジトリの非mainブランチ（最新SHAを使用）
        required: true
        type: string
      components:
        description: 更新対象（通常はall）
        type: choice
        options: [all, frontend, api, auto]
        default: all
permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: target
        with:
          script: |
            const { resolveTarget } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/deploy/target.mjs`);
            const target = await resolveTarget(github, context, 'staging');
            core.setOutput('sha', target.sha);
            core.setOutput('branch', target.branch);

  release:
    needs: resolve
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      staging: true
      target_sha: ${{ needs.resolve.outputs.sha }}
      target_branch: ${{ needs.resolve.outputs.branch }}
      components: ${{ inputs.components }}
    secrets: inherit
