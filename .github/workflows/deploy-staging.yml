name: Deploy staging

on:
  workflow_run:
    workflows: [Staging request]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: '手動デプロイする同一リポジトリのブランチ名（最新SHAを使用）'
        required: true
        type: string
      components:
        description: 更新対象（通常はall）
        type: choice
        options: [all, frontend, api, auto]
        default: all

permissions: {}

jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: target
        with:
          script: |
            const { resolveTarget } = await import('${{ github.workspace }}/scripts/staging/checks.mjs');
            const target = await resolveTarget(github, context);
            if (!target) {
              core.notice('同一リポジトリの非mainブランチからの公開要求ではないため、公開を省略します。');
              return;
            }
            core.setOutput('sha', target.sha);
            core.setOutput('branch', target.branch);

  release:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      staging: true
      target_sha: ${{ needs.resolve.outputs.sha }}
      target_branch: ${{ needs.resolve.outputs.branch }}
      components: ${{ inputs.components || 'all' }}
    secrets: inherit
