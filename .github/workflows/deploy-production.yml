name: deploy-production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      components:
        description: Components to deploy (use all for the first deployment)
        type: choice
        options: [auto, all, frontend, api]
        default: auto
      mode:
        description: Normal deployment or explicit restore to a previously verified commit
        type: choice
        options: [normal, restore]
        default: normal
      target_sha:
        description: Full commit SHA to restore (leave empty for normal deployment)
        type: string
      reason:
        description: Reason for restoring (required in restore mode)
        type: string
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      target_sha: ${{ inputs.target_sha || (inputs.mode == 'restore' && 'missing-restore-sha') || github.sha }}
      components: ${{ inputs.mode == 'restore' && 'all' || inputs.components || 'auto' }}
      mode: ${{ inputs.mode || 'normal' }}
      reason: ${{ inputs.reason || '' }}
    secrets: inherit
