name: Deploy frontend to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      staging:
        type: boolean
        default: false
      target_sha:
        type: string
        required: true
    secrets:
      CLOUDFLARE_WORKERS_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read

# staging is serialized by deploy-staging.yml across both services and smoke tests.
concurrency:
  group: frontend-${{ inputs.staging && github.run_id || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.staging || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.staging && 'staging' || 'production' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.staging && 'staging' || 'production' }}
      DEPLOY_COMMIT: ${{ inputs.target_sha || github.sha }}
      ASTRO_TELEMETRY_DISABLED: 1
      PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
      PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
      PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: calculation-engine/go.mod
          cache: false

      - name: Setup Takumi Guard for Go
        uses: flatt-security/setup-takumi-guard-golang@v1

      - name: Setup Takumi Guard for npm
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Install dependencies
        run: npm ci

      - name: Verify staging domain isolation
        if: inputs.staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-staging-target.mjs

      - name: Build frontend
        run: npm run build

      - name: Read candidate Wrangler version
        id: wrangler
        run: |
          version=$(cat .wrangler-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ env.DEPLOY_ENVIRONMENT }}

      - name: Write deployment summary
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            DEPLOY_URL="workers.dev URLとプレビューURLは無効"
          else
            DEPLOY_URL="https://staging.kippu-navi.com/deployment.json"
          fi
          {
            printf 'Environment: `%s`\n\n' "$DEPLOY_ENVIRONMENT"
            printf 'Branch: `%s`\n\n' "$DEPLOY_BRANCH"
            printf 'Commit: `%s`\n\n' "$DEPLOY_SHA"
            printf 'Deployment: %s\n' "$DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
