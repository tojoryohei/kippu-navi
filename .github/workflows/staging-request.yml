name: Staging request

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  request:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No checkout, deployment credentials, artifacts or privileged execution here.
      # The default-branch workflow_run consumer resolves and validates the head SHA.
      - run: echo 'Staging deployment requested.'
