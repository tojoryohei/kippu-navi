name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # ===================================================
  # [Frontend] Node.js 環境のジョブ
  # ===================================================
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  knip:
    name: Run Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Install dependencies
        run: npm ci

      - name: Run Knip
        run: npx knip

  test:
    name: Run Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Create data directories
        run: |
          mkdir -p src/data
          mkdir -p src/app/fare/data
          mkdir -p src/app/split/data

      - name: Cache data
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            src/data/*.db
            src/data/*.json
            src/app/fare/data/*.json
            src/app/split/data/*.json
          key: kippu-navi-data-v20260526-${{ hashFiles('.github/workflows/test.yml') }}

      - name: Authenticate to Google Cloud
        if: steps.cache.outputs.cache-hit != 'true' && github.actor != 'dependabot[bot]'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        if: steps.cache.outputs.cache-hit != 'true' && github.actor != 'dependabot[bot]'
        uses: google-github-actions/setup-gcloud@v2

      - name: Download data from private GCS
        if: steps.cache.outputs.cache-hit != 'true' && github.actor != 'dependabot[bot]'
        run: |
          gcloud storage cp gs://kippu-navi-build-secrets/data/*.db ./src/data/
          gcloud storage cp gs://kippu-navi-build-secrets/data/*.json ./src/data/
          gcloud storage cp gs://kippu-navi-build-secrets/fare/data/*.json ./src/app/fare/data/
          gcloud storage cp gs://kippu-navi-build-secrets/split/data/*.json ./src/app/split/data/

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        if: steps.cache.outputs.cache-hit == 'true' || github.actor != 'dependabot[bot]'
        run: npm run test

  frontend-regression:
    name: Build Astro and test browser navigation
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DEPLOY_ENVIRONMENT: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: calculation-engine/go.mod
          cache: false
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  # ===================================================
  # [Backend] Go 環境のジョブ
  # ===================================================
  go-lint:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: calculation-engine

  go-test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go Test
        working-directory: calculation-engine
        run: go test -v -race ./...