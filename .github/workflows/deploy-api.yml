name: Deploy API to Cloud Run

on:
  push:
    branches:
      - '**'
    paths:
      - 'calculation-engine/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  PROJECT_ID: 'bubbly-trail-470023-e4'
  REGION: 'asia-northeast1'
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'calculation-engine' || 'calculation-engine-staging' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/main' && 'calculation-engine-runtime@bubbly-trail-470023-e4.iam.gserviceaccount.com' || 'calculation-engine-stg-runtime@bubbly-trail-470023-e4.iam.gserviceaccount.com' }}
  INVOKER_SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/main' && 'cloudflare-api-invoker@bubbly-trail-470023-e4.iam.gserviceaccount.com' || 'cloudflare-api-invoker-stg@bubbly-trail-470023-e4.iam.gserviceaccount.com' }}
  GAR_REPO: 'cloud-run-source-deploy' 

concurrency:
  group: api-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: './calculation-engine/go.mod'

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Cache precomputed pass fares
        id: cache-pass
        uses: actions/cache@v6
        with:
          path: ./calculation-engine/data/precomputed/pass.bin
          key: precomputed-pass-v2-${{ hashFiles('calculation-engine/cmd/precompute-pass-fares/**', 'calculation-engine/internal/domain/**', 'calculation-engine/internal/pass/**', 'calculation-engine/internal/graphdata/edges.json', 'calculation-engine/go.mod', 'calculation-engine/go.sum') }}

      - name: Generate precomputed pass fares
        if: steps.cache-pass.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd calculation-engine
          mkdir -p data/precomputed
          go run ./cmd/precompute-pass-fares ./internal/graphdata/edges.json ./data/precomputed/pass.bin

      - name: Cache precomputed ticket fares
        id: cache-ticket
        uses: actions/cache@v6
        with:
          path: ./calculation-engine/data/precomputed/ticket.bin
          key: precomputed-ticket-v2-${{ hashFiles('calculation-engine/cmd/precompute-ticket-fares/**', 'calculation-engine/internal/domain/**', 'calculation-engine/internal/graphdata/**', 'calculation-engine/internal/ticket/**', 'calculation-engine/go.mod', 'calculation-engine/go.sum') }}

      - name: Generate precomputed ticket fares
        if: steps.cache-ticket.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd calculation-engine
          mkdir -p data/precomputed
          go run ./cmd/precompute-ticket-fares ./data/precomputed/ticket.bin

      - name: Validate precomputed binaries
        run: |
          set -euo pipefail
          verify_magic() {
            local path="$1"
            local expected="$2"
            local actual
            test -s "$path"
            actual=$(od -An -t x1 -N8 "$path" | tr -d ' \n')
            if [ "$actual" != "$expected" ]; then
              echo "事前計算データのmagicが不正です: $path" >&2
              return 1
            fi
          }

          pass_path=./calculation-engine/data/precomputed/pass.bin
          ticket_path=./calculation-engine/data/precomputed/ticket.bin
          verify_magic "$pass_path" "5352565242494e00"
          verify_magic "$ticket_path" "544b535256320000"

          expected_stations=$(jq -r '.[].station0, .[].station1' ./calculation-engine/internal/graphdata/edges.json | sort -u | wc -l | tr -d '[:space:]')
          actual_stations=$(od -An -t u4 -j8 -N4 "$pass_path" | tr -d '[:space:]')
          if [ "$expected_stations" != "$actual_stations" ]; then
            echo "定期券事前計算データの駅数が一致しません: graph=$expected_stations, data=$actual_stations" >&2
            exit 1
          fi
          ticket_stations=$(od -An -t u4 -j8 -N4 "$ticket_path" | tr -d '[:space:]')
          if [ "$ticket_stations" -le 0 ]; then
            echo "乗車券事前計算データの駅数が不正です: $ticket_stations" >&2
            exit 1
          fi

      - name: Build and Push Docker Image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          docker build -t $IMAGE_PATH ./calculation-engine
          docker push $IMAGE_PATH

      - name: Wait for matching Cloudflare deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FRONTEND_RUN_ID=''
          for _ in $(seq 1 30); do
            FRONTEND_RUN_ID=$(gh run list \
              --workflow=deploy-frontend.yml \
              --commit="$GITHUB_SHA" \
              --event=push \
              --limit=1 \
              --json=databaseId \
              --jq='.[0].databaseId // empty')
            [ -n "$FRONTEND_RUN_ID" ] && break
            sleep 10
          done
          [ -n "$FRONTEND_RUN_ID" ] || {
            echo "Matching Cloudflare deployment was not found for $GITHUB_SHA." >&2
            exit 1
          }
          gh run watch "$FRONTEND_RUN_ID" --exit-status

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--invoker-iam-check --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }} --memory=512Mi --concurrency=2 --timeout=30s'

      - name: Restrict Cloud Run invocation to Cloudflare
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --member="serviceAccount:$INVOKER_SERVICE_ACCOUNT" \
            --role='roles/run.invoker'

          PUBLIC_BINDING=$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')
          if [ -n "$PUBLIC_BINDING" ]; then
            gcloud run services remove-iam-policy-binding "$SERVICE_NAME" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --member='allUsers' \
              --role='roles/run.invoker'
          fi

      - name: Verify Cloud Run security settings
        run: |
          set -euo pipefail
          SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json)
          ACTUAL_RUNTIME_SERVICE_ACCOUNT=$(jq -r '.spec.template.spec.serviceAccountName' <<< "$SERVICE_JSON")
          [ "$ACTUAL_RUNTIME_SERVICE_ACCOUNT" = "$RUNTIME_SERVICE_ACCOUNT" ] || {
            echo "Unexpected runtime service account: $ACTUAL_RUNTIME_SERVICE_ACCOUNT" >&2
            exit 1
          }
          jq -e '(.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") != "true"' \
            <<< "$SERVICE_JSON" >/dev/null || {
            echo 'Cloud Run Invoker IAM check is disabled.' >&2
            exit 1
          }

          PUBLIC_BINDING=$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')
          [ -z "$PUBLIC_BINDING" ] || {
            echo 'Cloud Run still grants roles/run.invoker to allUsers.' >&2
            exit 1
          }

      - name: Show Output URL
        run: echo "Deployed URL - ${{ steps.deploy.outputs.url }}"
