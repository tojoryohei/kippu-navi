name: Deploy API to Cloud Run

on:
  push:
    branches:
      - '**'
    paths:
      - 'calculation-engine/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  PROJECT_ID: 'bubbly-trail-470023-e4'
  REGION: 'asia-northeast1'
  SERVICE_NAME: ${{ github.ref == 'refs/heads/main' && 'calculation-engine' || 'calculation-engine-staging' }}
  GAR_REPO: 'cloud-run-source-deploy' 

concurrency:
  group: api-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './calculation-engine/go.mod'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Get Precomputed Binary Metadata
        id: gcs-meta
        run: |
          PASS_MD5=$(gcloud storage objects describe gs://kippu-navi-build-secrets/data/precomputed_server.bin --format="value(md5Hash)" | tr -dc 'a-zA-Z0-9')
          TICKET_MD5=$(gcloud storage objects describe gs://kippu-navi-build-secrets/data/ticket_precomputed_server_v2.bin --format="value(md5Hash)" 2>/dev/null | tr -dc 'a-zA-Z0-9' || true)
          if [ -z "$TICKET_MD5" ]; then
            TICKET_MD5="missing-${{ github.sha }}"
          fi
          if [ -f ./calculation-engine/internal/graphdata/edges.json ]; then
            GRAPH_PATH=./calculation-engine/internal/graphdata/edges.json
          else
            GRAPH_PATH=./calculation-engine/internal/pass/graph/data/edges.json
          fi
          GRAPH_HASH=$(sha256sum "$GRAPH_PATH" | cut -c1-16)
          GRAPH_STATIONS=$(jq -r '.[].station0, .[].station1' "$GRAPH_PATH" | sort -u | wc -l | tr -d ' ')
          echo "pass_md5=$PASS_MD5" >> $GITHUB_OUTPUT
          echo "ticket_md5=$TICKET_MD5" >> $GITHUB_OUTPUT
          echo "graph_hash=$GRAPH_HASH" >> $GITHUB_OUTPUT
          echo "graph_path=$GRAPH_PATH" >> $GITHUB_OUTPUT
          echo "graph_stations=$GRAPH_STATIONS" >> $GITHUB_OUTPUT

      - name: Cache Precomputed Server Binary
        id: cache-bin
        uses: actions/cache@v4
        with:
          path: |
            ./calculation-engine/internal/pass/graph/data/precomputed_server.bin
            ./calculation-engine/internal/ticket/data/precomputed_server.bin
          key: precomputed-server-${{ env.SERVICE_NAME }}-${{ steps.gcs-meta.outputs.pass_md5 }}-${{ steps.gcs-meta.outputs.ticket_md5 }}-${{ steps.gcs-meta.outputs.graph_hash }}

      - name: Download Precomputed Server Binary
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          gcloud storage cp gs://kippu-navi-build-secrets/data/precomputed_server.bin ./calculation-engine/internal/pass/graph/data/
          if ! gcloud storage cp gs://kippu-navi-build-secrets/data/ticket_precomputed_server_v2.bin ./calculation-engine/internal/ticket/data/precomputed_server.bin; then
            (
              cd calculation-engine
              go run ./cmd/precompute-ticket-fares ./internal/ticket/data/precomputed_server.bin
            )
            gcloud storage cp ./calculation-engine/internal/ticket/data/precomputed_server.bin gs://kippu-navi-build-secrets/data/ticket_precomputed_server_v2.bin
          fi

      - name: Validate or regenerate pass precomputed binary
        run: |
          BINARY_PATH=./calculation-engine/internal/pass/graph/data/precomputed_server.bin
          EXPECTED_STATIONS="${{ steps.gcs-meta.outputs.graph_stations }}"
          ACTUAL_STATIONS=$(od -An -t u4 -j8 -N4 "$BINARY_PATH" | tr -d ' ')

          if [ "$EXPECTED_STATIONS" = "$ACTUAL_STATIONS" ]; then
            echo "定期券事前計算データを検証しました: ${ACTUAL_STATIONS}駅"
            exit 0
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "本番用事前計算データの駅数がグラフと一致しません: グラフ=${EXPECTED_STATIONS}, データ=${ACTUAL_STATIONS}"
            exit 1
          fi

          GRAPH_INPUT="${{ steps.gcs-meta.outputs.graph_path }}"
          GRAPH_INPUT="${GRAPH_INPUT#./calculation-engine/}"
          echo "ステージング用事前計算データを現行グラフから再生成します: グラフ=${EXPECTED_STATIONS}, データ=${ACTUAL_STATIONS}"
          (
            cd calculation-engine
            go run ./cmd/precompute-pass-fares "$GRAPH_INPUT" ./internal/pass/graph/data/precomputed_server.bin
          )

          ACTUAL_STATIONS=$(od -An -t u4 -j8 -N4 "$BINARY_PATH" | tr -d ' ')
          if [ "$EXPECTED_STATIONS" != "$ACTUAL_STATIONS" ]; then
            echo "再生成後も駅数が一致しません: グラフ=${EXPECTED_STATIONS}, データ=${ACTUAL_STATIONS}"
            exit 1
          fi
          echo "ステージング用事前計算データを検証しました: ${ACTUAL_STATIONS}駅"

      - name: Build and Push Docker Image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          docker build -t $IMAGE_PATH ./calculation-engine
          docker push $IMAGE_PATH

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'

      - name: Show Output URL
        run: echo "Deployed URL - ${{ steps.deploy.outputs.url }}"
