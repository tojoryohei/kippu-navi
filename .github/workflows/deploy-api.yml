name: Deploy API to Cloud Run

on:
  workflow_call:
    inputs:
      lease:
        type: string
        required: true
      staging:
        type: boolean
        default: false
      target_sha:
        type: string
        required: true
    secrets:
      WIF_PROVIDER:
        required: true
      SA_EMAIL:
        required: true

permissions: {}

env:
  PROJECT_ID: bubbly-trail-470023-e4
  REGION: asia-northeast1
  SERVICE_NAME: ${{ inputs.staging && 'calculation-engine-staging' || 'calculation-engine' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ inputs.staging && 'calculation-engine-stg-runtime@bubbly-trail-470023-e4.iam.gserviceaccount.com' || 'calculation-engine-runtime@bubbly-trail-470023-e4.iam.gserviceaccount.com' }}
  INVOKER_SERVICE_ACCOUNT: ${{ inputs.staging && 'cloudflare-api-invoker-stg@bubbly-trail-470023-e4.iam.gserviceaccount.com' || 'cloudflare-api-invoker@bubbly-trail-470023-e4.iam.gserviceaccount.com' }}
  GAR_REPO: cloud-run-source-deploy

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      control_sha: ${{ steps.resolve.outputs.control_sha }}
      environment: ${{ steps.resolve.outputs.environment }}
      public_config: ${{ steps.resolve.outputs.public_config }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: resolve
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.staging && 'staging' || 'production' }}
          DEPLOY_LEASE: ${{ inputs.lease }}
          REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
        with:
          script: |
            const { TARGET_SHA, CONTROL_SHA, DEPLOY_ENVIRONMENT } = process.env;
            if (![TARGET_SHA, CONTROL_SHA].every(sha => /^[a-f0-9]{40}$/.test(sha))) throw new Error('完全SHAが必要です');
            const lease = JSON.parse(process.env.DEPLOY_LEASE);
            if (lease.target !== TARGET_SHA || lease.environment !== DEPLOY_ENVIRONMENT || lease.runId !== process.env.GITHUB_RUN_ID || lease.attempt !== process.env.GITHUB_RUN_ATTEMPT) throw new Error('統括から全ジョブを再実行してください');
            core.setOutput('target_sha', TARGET_SHA);
            core.setOutput('control_sha', CONTROL_SHA);
            core.setOutput('environment', DEPLOY_ENVIRONMENT);
            const variables = JSON.parse(process.env.REPOSITORY_VARIABLES);
            const config = {};
            for (const key of ['PUBLIC_GOOGLE_ANALYTICS_ID', 'PUBLIC_POSTHOG_KEY', 'PUBLIC_SENTRY_DSN', 'SENTRY_ORG', 'SENTRY_PROJECT']) {
              config[key] = variables[`${DEPLOY_ENVIRONMENT.toUpperCase()}_${key}`] ?? variables[key] ?? '';
            }
            core.setOutput('public_config', JSON.stringify(config));
  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      api_id: ${{ steps.api.outputs.artifact-id }}
      api_sha256: ${{ steps.pack.outputs.api_sha256 }}
      attempt: ${{ steps.pack.outputs.attempt }}
    env:
      TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
      CONTROL_SHA: ${{ needs.resolve.outputs.control_sha }}
      DEPLOY_LEASE: ${{ inputs.lease }}
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: target/calculation-engine/go.mod
          cache: false
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a
      - name: Cache precomputed pass fares
        id: cache-pass
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./target/calculation-engine/data/precomputed/pass.bin
          key: precomputed-pass-v2-${{ hashFiles('target/calculation-engine/cmd/precompute-pass-fares/**', 'target/calculation-engine/internal/domain/**', 'target/calculation-engine/internal/pass/**', 'target/calculation-engine/internal/graphdata/edges.json', 'target/calculation-engine/go.mod', 'target/calculation-engine/go.sum') }}

      - name: Generate precomputed pass fares
        if: steps.cache-pass.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd target/calculation-engine
          mkdir -p data/precomputed
          go run ./cmd/precompute-pass-fares ./internal/graphdata/edges.json ./data/precomputed/pass.bin

      - name: Cache precomputed ticket fares
        id: cache-ticket
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./target/calculation-engine/data/precomputed/ticket.bin
          key: precomputed-ticket-v2-${{ hashFiles('target/calculation-engine/cmd/precompute-ticket-fares/**', 'target/calculation-engine/internal/domain/**', 'target/calculation-engine/internal/graphdata/**', 'target/calculation-engine/internal/ticket/**', 'target/calculation-engine/go.mod', 'target/calculation-engine/go.sum') }}

      - name: Generate precomputed ticket fares
        if: steps.cache-ticket.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd target/calculation-engine
          mkdir -p data/precomputed
          go run ./cmd/precompute-ticket-fares ./data/precomputed/ticket.bin

      - name: Validate precomputed binaries
        run: |
          set -euo pipefail
          verify_magic() {
            local path="$1"
            local expected="$2"
            local actual
            test -s "$path"
            actual=$(od -An -t x1 -N8 "$path" | tr -d ' \n')
            if [ "$actual" != "$expected" ]; then
              echo "事前計算データのmagicが不正です: $path" >&2
              return 1
            fi
          }

          pass_path=./target/calculation-engine/data/precomputed/pass.bin
          ticket_path=./target/calculation-engine/data/precomputed/ticket.bin
          verify_magic "$pass_path" "5352565242494e00"
          verify_magic "$ticket_path" "544b535256320000"

          expected_stations=$(jq -r '.[].station0, .[].station1' ./target/calculation-engine/internal/graphdata/edges.json | sort -u | wc -l | tr -d '[:space:]')
          actual_stations=$(od -An -t u4 -j8 -N4 "$pass_path" | tr -d '[:space:]')
          if [ "$expected_stations" != "$actual_stations" ]; then
            echo "定期券事前計算データの駅数が一致しません: graph=$expected_stations, data=$actual_stations" >&2
            exit 1
          fi
          ticket_stations=$(od -An -t u4 -j8 -N4 "$ticket_path" | tr -d '[:space:]')
          if [ "$ticket_stations" -le 0 ]; then
            echo "乗車券事前計算データの駅数が不正です: $ticket_stations" >&2
            exit 1
          fi

      - name: イメージを一度だけ作成して梱包
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/api-bundle"
          docker build --build-arg DEPLOY_COMMIT="$TARGET_SHA" -t "kippu-api:$TARGET_SHA" target/calculation-engine
          docker save -o "$RUNNER_TEMP/api-bundle/image.tar" "kippu-api:$TARGET_SHA"
          python3 control/scripts/deploy/artifact.py pack api "$RUNNER_TEMP/api-bundle" "$RUNNER_TEMP/api.tgz"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: api
        with:
          name: api-${{ needs.resolve.outputs.environment }}-${{ needs.resolve.outputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      target_sha: ${{ needs.resolve.outputs.target_sha }}
      artifact_id: ${{ needs.build.outputs.api_id }}
    env:
      TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
      CONTROL_SHA: ${{ needs.resolve.outputs.control_sha }}
      DEPLOY_LEASE: ${{ inputs.lease }}
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: control/.node-version
      - name: 現在の公開開始確認を照合
        run: node control/scripts/deploy/check-lease.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.api_id }}
          path: incoming
      - name: 成果物を明示的に検証して展開
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.api_sha256 }}
          EXPECTED_ATTEMPT: ${{ needs.build.outputs.attempt }}
        run: python3 control/scripts/deploy/artifact.py verify api incoming/api.tgz "$RUNNER_TEMP/verified-api"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '565.0.0'
      - name: 資格情報を渡す前にイメージを読み込む
        run: |
          docker load -i "$RUNNER_TEMP/verified-api/image.tar"
          docker image inspect "kippu-api:$TARGET_SHA" >/dev/null
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}
      - name: 登録してdigestを記録
        id: publish
        run: |
          set -euo pipefail
          image_path="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE_NAME"
          image_tag="$TARGET_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud auth print-access-token | docker login "$REGION-docker.pkg.dev" --username oauth2accesstoken --password-stdin
          docker tag "kippu-api:$TARGET_SHA" "$image_path:$image_tag"
          docker push "$image_path:$image_tag"
          image_digest=$(gcloud artifacts docker images describe "$image_path:$image_tag" --format='value(image_summary.digest)')
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "image=$image_path@$image_digest" >> "$GITHUB_OUTPUT"
      - name: Docker認証を削除
        if: always()
        run: docker logout "$REGION-docker.pkg.dev"

  deploy:
    needs: [resolve, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
      CONTROL_SHA: ${{ needs.resolve.outputs.control_sha }}
      DEPLOY_LEASE: ${{ inputs.lease }}
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      PUBLISHED_IMAGE: ${{ needs.publish.outputs.image }}
      PUBLISHED_TARGET: ${{ needs.publish.outputs.target_sha }}
      PUBLISHED_ARTIFACT: ${{ needs.publish.outputs.artifact_id }}
      EXPECTED_ARTIFACT: ${{ needs.build.outputs.api_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: control/.node-version
      - name: 現在の公開開始確認を照合
        run: node control/scripts/deploy/check-lease.mjs
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '565.0.0'
      - name: 登録結果と公開先を検証
        run: |
          set -euo pipefail
          [ "$PUBLISHED_TARGET" = "$TARGET_SHA" ]
          [ "$PUBLISHED_ARTIFACT" = "$EXPECTED_ARTIFACT" ]
          prefix="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$SERVICE_NAME@sha256:"
          [[ "$PUBLISHED_IMAGE" == "$prefix"* ]]
          image_digest="${PUBLISHED_IMAGE#"$prefix"}"
          [[ "$image_digest" =~ ^[a-f0-9]{64}$ ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}
      - name: digestでCloud Runに公開
        run: |
          gcloud run deploy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" \
            --image "$PUBLISHED_IMAGE" --update-env-vars "DEPLOY_ENVIRONMENT=$DEPLOY_ENVIRONMENT,DEPLOY_COMMIT=$TARGET_SHA" \
            --invoker-iam-check --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --memory 512Mi --concurrency 2 --timeout 30s --quiet
          gcloud run services update-traffic "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --to-latest --quiet
      - name: Cloud Runの呼び出し認証を維持
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --member="serviceAccount:$INVOKER_SERVICE_ACCOUNT" \
            --role='roles/run.invoker'

          PUBLIC_BINDING=$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')
          if [ -n "$PUBLIC_BINDING" ]; then
            gcloud run services remove-iam-policy-binding "$SERVICE_NAME" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --member='allUsers' \
              --role='roles/run.invoker'
          fi

      - name: Verify Cloud Run security settings
        run: |
          set -euo pipefail
          SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json)
          ACTUAL_RUNTIME_SERVICE_ACCOUNT=$(jq -r '.spec.template.spec.serviceAccountName' <<< "$SERVICE_JSON")
          [ "$ACTUAL_RUNTIME_SERVICE_ACCOUNT" = "$RUNTIME_SERVICE_ACCOUNT" ] || {
            echo "Unexpected runtime service account: $ACTUAL_RUNTIME_SERVICE_ACCOUNT" >&2
            exit 1
          }
          jq -e '(.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false") != "true"' \
            <<< "$SERVICE_JSON" >/dev/null || {
            echo 'Cloud Run Invoker IAM check is disabled.' >&2
            exit 1
          }

          PUBLIC_BINDING=$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')
          [ -z "$PUBLIC_BINDING" ] || {
            echo 'Cloud Run still grants roles/run.invoker to allUsers.' >&2
            exit 1
          }

      - name: 配信Revision・メタデータSHA・digestを照合
        run: node control/scripts/deploy/verify-revision.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: revision-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-results/
          retention-days: 14
